[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carver-quant-lab"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]